services:
  qrisaw:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: 0.0.0.0
    restart: unless-stopped
    security_opt:
      # default Docker seccomp + namespace creation, so Chromium's sandbox works in-container
      - seccomp=./docker/seccomp-chromium.json
